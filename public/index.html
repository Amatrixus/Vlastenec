<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <meta name="theme-color" content="#1a100b" />
  <title>INQUIZITOR</title>
  <link rel="stylesheet" href="home.css" />
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const forceIntro = params.get('intro') === '1';
      const hasSeenIntro = localStorage.getItem('vlastenec_intro_seen') === '1';
      if (hasSeenIntro && !forceIntro) {
        window.location.replace('homepage.html');
      }
    })();
  </script>
  <link rel="stylesheet" href="mobile-web.css?v=mobile-web-v1" />
  <link rel="stylesheet" href="inquizitor-brand.css?v=brand-v1" />

  <style id="inquizitor-intro-play-v3">
    /* Inquizitor intro CTA — ceremonial, restrained, and deliberately not a pill button. */
    #intro-play.intro-play {
      position: relative;
      isolation: isolate;
      width: calc(100% / 3);
      min-height: 58px;
      padding: 0 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 148, 31, .72);
      border-radius: 2px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.025), rgba(0,0,0,.12)),
        rgba(20, 13, 9, .64);
      color: rgba(255,255,255,.96);
      box-shadow:
        inset 0 0 0 1px rgba(255,148,31,.035),
        0 12px 30px rgba(0,0,0,.16);
      font: inherit;
      font-size: 11px;
      font-weight: 850;
      line-height: 1;
      letter-spacing: .26em;
      text-transform: uppercase;
      cursor: pointer;
      transform: translateZ(0);
      transition:
        border-color .22s ease,
        box-shadow .22s ease,
        color .22s ease,
        transform .22s ease;
    }

    #intro-play.intro-play::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #ff941f;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform .30s cubic-bezier(.2,.75,.25,1);
    }

    #intro-play.intro-play::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 7px;
      height: 1px;
      z-index: 1;
      background: linear-gradient(90deg, transparent, rgba(255,148,31,.5), transparent);
      opacity: .58;
      transition: opacity .22s ease, background .22s ease;
    }

    #intro-play.intro-play > span {
      position: relative;
      z-index: 2;
      display: inline-block;
      /* Visually center tracked text despite the final letter-spacing. */
      margin-left: .26em;
      transition: transform .22s ease;
    }

    #intro-play.intro-play:hover {
      border-color: #ff941f;
      color: #17100b;
      box-shadow:
        0 0 0 1px rgba(255,148,31,.08),
        0 14px 34px rgba(0,0,0,.22),
        0 0 22px rgba(255,148,31,.09);
      transform: translateY(-1px);
    }

    #intro-play.intro-play:hover::before,
    #intro-play.intro-play:focus-visible::before {
      transform: scaleX(1);
    }

    #intro-play.intro-play:hover::after,
    #intro-play.intro-play:focus-visible::after {
      opacity: .22;
      background: linear-gradient(90deg, transparent, rgba(23,16,11,.65), transparent);
    }

    #intro-play.intro-play:hover > span {
      transform: translateX(2px);
    }

    #intro-play.intro-play:active {
      transform: translateY(0);
    }

    #intro-play.intro-play:focus-visible {
      outline: 2px solid rgba(255,148,31,.48);
      outline-offset: 4px;
      color: #17100b;
    }

    /* Keep the CTA in the third column, directly under “Ovládni mapu”. */
    .intro-actions {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    @media (max-width: 620px) {
      #intro-play.intro-play {
        width: 100%;
        min-height: 52px;
        font-size: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #intro-play.intro-play,
      #intro-play.intro-play::before,
      #intro-play.intro-play::after,
      #intro-play.intro-play > span {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="intro-backdrop" aria-hidden="true">
    <div class="intro-lion"></div>
    <div class="intro-glow intro-glow-a"></div>
    <div class="intro-glow intro-glow-b"></div>
    <div class="intro-grain"></div>
  </div>

  <main class="intro-stage">
    <section class="intro-shell" aria-labelledby="intro-title">
      <div class="intro-content">
        <div class="intro-copy">
          <div class="intro-kicker iq-kicker"><img class="iq-kicker-symbol" src="inquizitor.svg" alt="" aria-hidden="true" /><span>OVLÁDNI ČESKO</span></div>

          <img class="intro-logo iq-intro-wordmark" src="inquizitor2.svg" alt="Inquizitor" id="intro-title" />

          <h1>Území se nezískává silou.<br><span>Získává se znalostmi.</span></h1>

          <p class="intro-lead">
            Vědomostní strategická hra, ve které obsazuješ české regiony,
            bráníš svou základnu a soupeříš s ostatními hráči o vládu nad mapou.
          </p>

          <div class="intro-points" aria-label="Hlavní prvky hry">
            <div class="intro-point">
              <strong>01</strong>
              <span>Vyber území</span>
            </div>
            <div class="intro-point">
              <strong>02</strong>
              <span>Odpověz správně</span>
            </div>
            <div class="intro-point">
              <strong>03</strong>
              <span>Ovládni mapu</span>
            </div>
          </div>

          <div class="intro-actions">
            <button id="intro-play" class="intro-play" type="button"><span>HRÁT</span></button>
          </div>
        </div>

        <div class="intro-map-area" aria-hidden="true">
          <div class="intro-map-frame">
            <div class="intro-map-halo"></div>
            <img class="intro-map" src="map.svg" alt="" />
            <div class="intro-map-shine"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('intro-play')?.addEventListener('click', () => {
      localStorage.setItem('vlastenec_intro_seen', '1');
      window.location.href = 'homepage.html';
    });
  </script>
</body>
</html>
