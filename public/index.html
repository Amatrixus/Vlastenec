<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a100b" />
  <title>VLASTENEC</title>
  <link rel="stylesheet" href="home.css" />
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const forceIntro = params.get('intro') === '1';
      const hasSeenIntro = localStorage.getItem('vlastenec_intro_seen') === '1';
      if (hasSeenIntro && !forceIntro) {
        window.location.replace('homepage.html');
      }
    })();
  </script>
  <link rel="stylesheet" href="mobile-web.css?v=mobile-web-v1" />
</head>
<body>
  <div class="intro-backdrop" aria-hidden="true">
    <div class="intro-lion"></div>
    <div class="intro-glow intro-glow-a"></div>
    <div class="intro-glow intro-glow-b"></div>
    <div class="intro-grain"></div>
  </div>

  <main class="intro-stage">
    <section class="intro-shell" aria-labelledby="intro-title">
      <div class="intro-content">
        <div class="intro-copy">
          <div class="intro-kicker">OVLÁDNI ČESKO</div>

          <img class="intro-logo" src="logo.svg" alt="Vlastenec" id="intro-title" />

          <h1>Území se nezískává silou.<br><span>Získává se znalostmi.</span></h1>

          <p class="intro-lead">
            Vědomostní strategická hra, ve které obsazuješ české regiony,
            bráníš svou základnu a soupeříš s ostatními hráči o vládu nad mapou.
          </p>

          <div class="intro-points" aria-label="Hlavní prvky hry">
            <div class="intro-point">
              <strong>01</strong>
              <span>Vyber území</span>
            </div>
            <div class="intro-point">
              <strong>02</strong>
              <span>Odpověz správně</span>
            </div>
            <div class="intro-point">
              <strong>03</strong>
              <span>Ovládni mapu</span>
            </div>
          </div>

          <div class="intro-actions">
            <button id="intro-play" class="intro-play" type="button">HRÁT</button>
          </div>
        </div>

        <div class="intro-map-area" aria-hidden="true">
          <div class="intro-map-frame">
            <div class="intro-map-halo"></div>
            <img class="intro-map" src="map.svg" alt="" />
            <div class="intro-map-shine"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.getElementById('intro-play')?.addEventListener('click', () => {
      localStorage.setItem('vlastenec_intro_seen', '1');
      window.location.href = 'homepage.html';
    });
  </script>
</body>
</html>
